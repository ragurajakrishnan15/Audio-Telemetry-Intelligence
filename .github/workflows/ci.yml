name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-spark.txt

      # Spark needs a JVM; Temurin 17 is what the Spark path was verified with.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-spark.txt

      - name: Confirm Spark prerequisites
        run: |
          java -version
          python -c "import pyspark; print('pyspark', pyspark.__version__)"

      # FAIL_ON_SKIP (see tests/conftest.py) turns any skipped test into a failure,
      # so a missing JVM/PySpark can't quietly skip the Spark parity tests.
      - name: Run tests
        env:
          FAIL_ON_SKIP: "1"
        run: pytest tests -q -rs
